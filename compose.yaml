services:
  postgres:
    image: postgres:16-alpine
    container_name: family-finances-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-family_finances}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "${DB_PORT:-5450}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-family_finances}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - family-finances-network

volumes:
  postgres_data:
    name: family-finances-postgres-data

networks:
  family-finances-network:
    name: family-finances-network
    driver: bridge